name: Keep Render App Awake

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions cron can be delayed by up to 10 mins, so this ensures it hits within the 15 min window)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production URL
        run: |
          # REPLACE the URL below with your actual Render production URL
          curl -sS https://mutual-fund-app-540r.onrender.com > /dev/null
          echo "Pinged successfully"
