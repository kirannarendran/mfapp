<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="28" y1="36" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Institutional Base Plate with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Foundation Pillar (Precision Institutional Bar) -->
  <rect x="15" y="34" width="7" height="15" rx="3" fill="#64748b" opacity="0.8" />
  
  <!-- Mid-Alpha Core Bar -->
  <rect x="27" y="25" width="7" height="24" rx="3" fill="url(#primaryGrad)" />
  
  <!-- Ascendant Outperformance Bar with Crest Cap -->
  <rect x="39" y="16" width="7" height="33" rx="3" fill="url(#accentGrad)" />

  <!-- Geometric Pulse Chevron Point -->
  <circle cx="42.5" cy="16" r="3" fill="#34d399" />
</svg>
